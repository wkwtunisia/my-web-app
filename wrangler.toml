name = "my-web-app"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Pour Next.js, on utilise le dossier .next comme assets
[assets]
directory = ".next/static"
binding = "ASSETS"

# Configuration pour les pages dynamiques
[env.production]
routes = ["*"]

# Désactiver les logs trop verbaux
logpush = false
